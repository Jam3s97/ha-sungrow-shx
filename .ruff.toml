# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

# The vendored device library under sungrow_modbus/ ships its own lint
# configuration upstream (see the sungrow-modbus package) and is not
# reformatted to this project's stricter house style; see README.md.
extend-exclude = ["custom_components/sungrow/sungrow_modbus"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # this repo relies on the single top-level LICENSE file, not per-file headers
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# Test code follows pytest conventions rather than the house library style:
# plain `assert` is how pytest reports failures, comparing against literal
# expected values is the point of a test, and fixture/monkeypatch fakes take
# arguments only to match the signature they are replacing.
"tests/*" = ["ANN201", "ARG001", "D100", "D101", "D102", "D103", "PLR2004", "S101"]
